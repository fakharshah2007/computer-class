<!DOCTYPE html>

<head>

<body class="bg-[#f7f9fb] text-[#191c1e] font-['Plus_Jakarta_Sans',sans-serif] min-h-screen p-8">

    <div class="grid grid-cols-1 gap-6">

  <path d="M42 57.5V67C42 70 58 70 58 67V57.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="65" cy="65.5" r="2.5" fill="#f59e0b"/>
  <path d="M31 38L50 26L69 38" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Typography -->
  <text x="102" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0a5c48" letter-spacing="-0.5">SKILL COMPUTER</text>
  <text x="102" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="2">ACADEMY</text>
  <rect x="330" y="32" width="56" height="20" rx="6" fill="#ecfdf5"/>
  <text x="358" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">100% FREE</text>
</svg>
        </div>
      </div>

      <div class="bg-[#004333] p-8 rounded-2xl shadow-md border border-gray-800 flex flex-col items-center gap-4">
        <span class="text-xs font-bold uppercase tracking-wider text-emerald-300">Full Logo on Institutional Dark Teal</span>
        <div class="w-full max-w-md py-4 p-4 rounded-xl bg-white/10 backdrop-blur">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <rect width="70" height="70" x="15" y="15" rx="18" fill="#0a5c48"/>
  <path d="M35 52L50 42L65 52L50 62L35 52Z" fill="#ffffff" fill-opacity="0.95"/>
  <path d="M42 57.5V67C42 70 58 70 58 67V57.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="330" y="32" width="56" height="20" rx="6" fill="#ecfdf5"/>

<!-- Stitch Screen Switcher -->

  <span style="font-weight: 700; display: flex; align-items: center; gap: 6px; color: #a9f1d6; letter-spacing: 0.02em;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    STITCH SCREENS

  <div style="height: 16px; width: 1px; background: rgba(255,255,255,0.2);"></div>

  <a href="logo.html" style="color: #ffffff; text-decoration: none; padding: 5px 12px; border-radius: 9999px; font-weight: 600; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='transparent'">🎨 Logo</a>
